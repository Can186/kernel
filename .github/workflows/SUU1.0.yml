name: Build SUU Kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖和工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev make zip wget
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-12.0.1-x86_64-linux-gnu-* /opt/clang12
          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 修复源码（基础修复）
        run: |
          sed -i 's/(unsigned int)\*cmdq_handle/(unsigned long)*cmdq_handle/g' drivers/gpu/drm/mediatek/mtk_drm_crtc.c
          echo "void scp_wdt_reset(int cpu_id);" >> drivers/misc/mediatek/scp/mt6873/scp_helper.h
          echo "void scp_wdt_reset(int cpu_id);" >> drivers/misc/mediatek/scp/mt6873/scp_excep.h
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/firmware
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/pramboot
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_i.fw
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i
          touch drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i
          grep -q "stpcpy" lib/string.c || printf '\n#ifndef __HAVE_ARCH_STPCPY\nchar *stpcpy(char *dest, const char *src)\n{\n\twhile ((*dest = *src) != '"'\\0'"') {\n\t\tdest++;\n\t\tsrc++;\n\t}\n\treturn dest;\n}\nEXPORT_SYMBOL(stpcpy);\n#endif\n' >> lib/string.c

      - name: 拉取 MTK 驱动并配置 WLAN
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch cezanne-r-oss https://github.com/MiCode/MTK_kernel_modules.git vendor/mediatek/kernel_modules
          sed -i 's|TOP := $(srctree)/\.\.|TOP := $(srctree)/|' vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile
          sed -i 's|TOP := $(srctree)/\.\.|TOP := $(srctree)/|' vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile

      - name: 修改 connectivity Makefile 并创建软链接
        run: |
          CONN_MK="drivers/misc/mediatek/connectivity/Makefile"
          cp "$CONN_MK" "${CONN_MK}.bak"
          sed -i 's/\bunlink\b/rm -rf/g' "$CONN_MK"
          sed -i 's/\bln -s\b/ln -snf/g' "$CONN_MK"
          sed -i 's|\$(srctree)/\.\./|\$(srctree)/|g' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*PATH_TO_WMT_DRV[[:space:]]*=).*|\1 vendor/mediatek/kernel_modules/connectivity/common|' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*PATH_TO_WLAN_CHR_DRV[[:space:]]*=).*|\1 vendor/mediatek/kernel_modules/connectivity/wlan/adaptor|' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*PATH_TO_WLAN_DRV[[:space:]]*=).*|\1 vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m|' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*ABS_PATH_TO_WMT_DRV[[:space:]]*=).*|\1 $(abspath $(srctree)/$(PATH_TO_WMT_DRV))|' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*ABS_PATH_TO_WLAN_CHR_DRV[[:space:]]*=).*|\1 $(abspath $(srctree)/$(PATH_TO_WLAN_CHR_DRV))|' "$CONN_MK"
          sed -i -E 's|^([[:space:]]*ABS_PATH_TO_WLAN_DRV[[:space:]]*=).*|\1 $(abspath $(srctree)/$(PATH_TO_WLAN_DRV))|' "$CONN_MK"
          rm -rf drivers/misc/mediatek/connectivity/wlan_drv_gen4m
          rm -rf drivers/misc/mediatek/connectivity/wmt_chrdev_wifi
          rm -rf drivers/misc/mediatek/connectivity/wmt_drv
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m" drivers/misc/mediatek/connectivity/wlan_drv_gen4m
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/adaptor" drivers/misc/mediatek/connectivity/wmt_chrdev_wifi
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/common" drivers/misc/mediatek/connectivity/wmt_drv
          test -f drivers/misc/mediatek/connectivity/wlan_drv_gen4m/Makefile
          test -f drivers/misc/mediatek/connectivity/wmt_chrdev_wifi/Makefile
          test -f drivers/misc/mediatek/connectivity/wmt_drv/Makefile

      - name: 集成 SukiSU Ultra + SUSFS (Inline Hook)
        run: |
          rm -f drivers/kernelsu/selinux/selinux.c
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" | bash
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o /tmp/susfs.patch
          patch -p1 < /tmp/susfs.patch || true
          sed -i '/static void smap_gather_stats/,/^}/{s/return 0;/return;/}' fs/proc/task_mmu.c
          sed -i '/#include "internal.h"/a #include <linux/susfs_def.h>' fs/proc/task_mmu.c

      - name: 修复 SukiSU Ultra 编译错误
        run: |
          sed -i 's/fallthrough;/__attribute__((fallthrough));/g' drivers/kernelsu/policy/allowlist.c
          sed -i '145s/strncpy_from_user_nofault/__strncpy_from_user_nofault/' drivers/kernelsu/sulog/event.c
          sed -i '1i extern void ksu_selinux_hide_handle_post_fs_data(void);\nextern void ksu_selinux_hide_handle_second_stage(void);' drivers/kernelsu/ksu.c

      - name: 修复 SukiSU SELinux 函数缺失
        run: |
          if ! grep -q "ksu_selinux_hide_handle_post_fs_data(void) {" drivers/kernelsu/ksu.c; then
            printf '\nvoid ksu_selinux_hide_handle_post_fs_data(void) { }\nvoid ksu_selinux_hide_handle_second_stage(void) { }\n' >> drivers/kernelsu/ksu.c
          fi

      

          
      - name: 配置和编译
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out atom_user_defconfig
          cd out
          ../scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ../scripts/config --disable LTO_CLANG
          ../scripts/config -e CONFIG_WLAN_DRV_BUILD_IN
          ../scripts/config -e CONFIG_MTK_COMBO_BT
          ../scripts/config -e CONFIG_KALLSYMS
          ../scripts/config -e CONFIG_KALLSYMS_ALL
          ../scripts/config -e CONFIG_KSU
          ../scripts/config -e CONFIG_KSU
          ../scripts/config -e CONFIG_KALLSYMS
          ../scripts/config -e CONFIG_KALLSYMS_ALL
          ../scripts/config -e CONFIG_KSU_SUSFS
          ../scripts/config -e CONFIG_KSU_SUSFS_SUS_PATH
          ../scripts/config -e CONFIG_KSU_SUSFS_SUS_MOUNT
          ../scripts/config -e CONFIG_KSU_SUSFS_SUS_KSTAT
          ../scripts/config -e CONFIG_KSU_SUSFS_SPOOF_UNAME
          ../scripts/config -e CONFIG_KSU_SUSFS_ENABLE_LOG
          ../scripts/config -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ../scripts/config -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ../scripts/config -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ../scripts/config -e CONFIG_KSU_SUSFS_SUS_MAP
          ../scripts/config -e CONFIG_KPM
          cd ..
          yes "" | make ARCH=arm64 olddefconfig O=out
          yes "" | make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out CONFIG_WLAN_DRV_BUILD_IN=y

      - name: 上传内核
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_3.0.0
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/mt6873.dtb
